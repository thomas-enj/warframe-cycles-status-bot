name: Update Baro Inventory

on:
  repository_dispatch:
    types:
      - update_baro_inventory

permissions:
  contents: read

jobs:
  update-inventory:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install requests

      - name: Update Discord inventory message
        env:
          BARO_ACTIVE: ${{ github.event.client_payload.is_active }}
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          DISCORD_CHANNEL: ${{ secrets.DISCORD_CHANNEL }}
          BARO_MSG2_ID: ${{ secrets.BARO_MSG2_ID }}
        run: python scripts/fetch_baro_inventory.py